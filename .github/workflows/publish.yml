name: Publish

# Publishes to npm when a GitHub release is published.
# Requires an `NPM_TOKEN` repository secret (an npm automation/granular token
# with publish rights for this package).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # needed for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Check release tag matches package.json version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version="$(node -p \"require('./package.json').version\")"
        if [ \"$TAG\" != \"v$version\" ] && [ \"$TAG\" != \"$version\" ]; then
          echo \"Release tag '$TAG' does not match package.json version '$version'\" >&2
          exit 1
        fi

    - name: Install dependencies
      run: npm ci

    - name: Publish
      # `prepublishOnly` runs type check, tests and the build first.
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
